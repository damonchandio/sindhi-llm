ا"], "b": ["lora", " ۾ واقع آهي. هيءُ شهر اڳي پاڪستان جو صوبائي وزيراعظم هو.\nپنجاب ضلعي جو هڪ نئين سياسي سربراهه بڻيل سنڌي شاعرن مان"]}, {"prompt": "سنڌي ثقافت", "a": ["lora", " ۾ اهڙو سبب آهي جنهن مان عالمي فڪر پيدا ٿيو. هتان کي عربي، الفارسي ۽ انگريزي قوميت بابت تاريخ ملي چُڪَي آهي"], "b": ["base", "\n\n# چنگ سرکان داره کو را از مسند نہیں لے جائے\n\n### خبر و شرح:\n\nبلاستن توروند بادل دوئان دونوٰت،"]}, {"prompt": "اجرڪ ۽ ٽوپي", "a": ["lora", "، جنهن کان سواءِ مهينگ سرمست (Mammoth) بزرگ آهي. هندستان ۾ اها قديم ترين ٻوليون آهن.\nسنڌ پاڻيءَ ۾ روايت آهي"], "b": ["base", "\n\n# چوندرا باره ڇنگ ها تر ئل جان از مسکين ساموا \n\n## رابط لاء نياز وڌيان\n\n- 2015 کيائنا ختم\n"]}, {"prompt": "سچل سرمست", "a": ["base", " روزش امروز\nنامه داده شده بستگ بر مجموعه چند جملات در زبان لغة تاربي\n\n---\n\n**برخی اصل**\n\nباستثنای نتائج کوتاه، تمام"], "b": ["lora", " جي شاهه عنايت کان پوءِ گجرات، نوشهري تعلقي ميرپورخاص، دادو ضلعو ۽ سنڌ جا اڏتا آهن.\nڪوهستان: هن شهر جون و"]}, {"prompt": "ٿر جو ريگستان", "a": ["base", " سان دا نارن اچھے میں ہونے والے بیکل کامیز رہتا ہوا پسند فردوس تیسری دفعات سازدوار شمار لینے دیتے"], "b": ["lora", " آهي. ھن ملڪ جي پکين تي مشتمل عمارتون ۽ سياحن کان سواءِ ان جا نامور فوجي مقابلا، شاعريون، ادب، ليکڪيون، لباس،"]}, {"prompt": "سنڌ جي موسم", "a": ["base", " سان ته اين جويا چاپشني وارث يندي موسبي نجاح؟\n\nبلاس، برايشاً داٰمَرَتُ لِلزورِّيْدَة"], "b": ["lora", " ۾ سخت نظر اچڻ وارن ملڪن کان سواءِ انگريزن، آمريڪا ۽ پنجاب تائين فوجون هٿياردار رهيون. شاهه عبداللطيف ڀٽائي"]}, {"prompt": "سنڌ ۾ زراعت", "a": ["lora", " جي معاشري، صنعتين، پاڻيءَ جو دورو وغيره جون اداريون قائم ڪيو. ان کان سواءِ سرحد رستي وارن شھرن ۽ تپالن ۾ به"], "b": ["base", " باغل جا اختراع شرکت جو سبب جن مان وحده نامج آندڻ ئي\n\nAnswer:\n\nThe first thing to note is that the question asks about a \"sustainable agriculture\" innovation, which can be"]}, {"prompt": "سنڌي ادب", "a": ["lora", " جا ڪيترا شاعر سندن هميشہ خدمتن کان واقف آهن.\n1832ع – پروفيسر ايڇ. سي رامپور، سنڌ يونيورسٽيءَ مان علام"], "b": ["base", " جامع\n\n# چون کرنا تا نجات سبکو دانشگرا كه ين راز موسى ساحل باريس دينار شئي فروق بلوغ و عرضه مالديز"]}, {"prompt": "ڪراچي جو بندرگاهه", "a": ["lora", " آهي.\nشبندي سنڌ ۾ پرائمري تعليم کان وٺي ايم اي، انٽرميڊئيٽ ۽ ايم.اي. بي سيءَ سان معلومات حاصل ڪئي آهي."], "b": ["base", " سائیس لاندا را ترجمه کن\n\n\"Hey, what's up? I'm going to go on a trip with my best friend.\"  \nTo the person in charge of the project.\n\nIn order to make this translation more natural and effective, let me suggest"]}, {"prompt": "سنڌ جو کاڌو", "a": ["base", " ميتوبيجنيک چيو ته اسندرو شاندو سائيت دى سائيدو قرآتي لوازا سياستو براوند وارديت رندا نامشين يو كومباج"], "b": ["lora", "، گهڻي معلومات حاصل آهي. هن پنهنجي دؤر سان انکي اڳتي وڃائي راهيءَ تائين سنڀالي نٿي سگهجي.\nهن وقت به خودمخت"]}, {"prompt": "لاڙڪاڻو", "a": ["lora", " ضلعي جي ھڪ يونين ڪائونسل جو نالو آهي. ان کان علاوه اتان جي صوبائي گريجوئيشن حيدرآباد واري شاخ پارلياماني يوني"], "b": ["base", " جي چانه جي تھي کان ملک لاء جي اسافت فار مايو نامون ؟\n\nنامون\nملوک لئين باري سگني هر دواز 13025"]}, {"prompt": "سنڌ جي آبادي", "a": ["lora", " 1984ع کان شروعات ۾ سڀني قسمن م ايراضيءَ تي واقع هئي. ان وقت سنڌ جو پهريون نارنگو وزيراعظم رحيم علي خاصخيلي"], "b": ["base", " ترتيسي مان دا سائيروز ليره 2019-2023، اسٰت کيچ فنادو ناگل كارديجورنيش بريشي ڇم شوي 2"]}, {"prompt": "ميلا ۽ تهوار", "a": ["lora", "ا جي اهميت.\nسياست سان لاڳو ٿيو. هن ملڪ کي آمريڪي قومي راءِ (United States of America) يا نئين زندگيءَ جو حصو بڻائي،"], "b": ["base", "ين\n\n# سوچن اسٰرائي\n## نام جا شرح:\n**مَلْتُبِي مالك**\n## واریانس: \n- **مَلْتُبِي مالك**:"]}];let i=0,score={base:0,lora:0,tie:0};const app=document.getElementById('app');
function show(){if(i>=items.length){const t=score.base+score.lora+score.tie;app.innerHTML=`<div id=done>Done.<br>trained ${score.lora} · base ${score.base} · same ${score.tie}<br><small>${t} prompts. Copy this line into results/human.txt</small></div>`;return}
const it=items[i];app.innerHTML=`<small>${i+1} / ${items.length}</small><p class=q>${it.prompt}…</p>
