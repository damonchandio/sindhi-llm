b": ["base", " ٽوئنڊر سان واسطىءِ اسٽاڻ بابت تعليم نافذ ٿيندي آهي، جنهن لاءِ ايس ايس بي سي جي ڄمائي طالبина"]}, {"prompt": "سنڌ جو کاڌو", "a": ["base", " چيئن تي وري ڳالهائيندي آهي. نٿا سگهن ۽ روزانو شرطن مان پيدا ٿيندڙ ڪميتون هر طرح جي ڊيلرن"], "b": ["lora", " ۽ پيئڻ وارو سامان به اسپيشل آهي. هتي مانيءَ لاءِ ته تمام گھٽ خريداريون ڪيون ويٺاسين، جن ۾ چانورن"]}, {"prompt": "لاڙڪاڻو", "a": ["lora", ") ۾ پنھنجي سرگرم زندگيءَ تي اثر انداز رهيو. جتي مون کانسواءِ، عابد منصور به واقعي هليو آهي.\nپوءِ سنڌ يوني"], "b": ["base", "\n== ۽ ==\n* اردو جي سڀني تقريرن لاءِ مختصر شبيهات ۽ رابطه وارا عبارتون آهي.\n* ان مان چڱو دلچسپي نٿ"]}, {"prompt": "سنڌ جي آبادي", "a": ["lora", " ۾ اضافو، ان کان علاوه سنڌ پارٽيءَ واري راڄ\nڪراچي سکر روڊ تي نئين حالت موجب ڦلندڙ هوا، لڳاتار برس"], "b": ["base", " 2017 مان وٺي اچي رهيا آهي، جنهن لاءِ انديشتي نمبرس ايميل تائيد ڪرڻ ۾ مدد گهرجي. ۽ ها سندس د"]}, {"prompt": "ميلا ۽ تهوار", "a": ["lora", "، پيرين جي آمد يا ورڻ سان روزگار مليو هوندو هو. اڄڪلهه ته انهن کاڌ خوراڪ بابت به نئون نظام قائم ٿيو آهي.\n”سائ"], "b": ["base", " وانگر لاءِ مصنوعي ذميوط ۽ جذبت جو انتظام نه ٿو ڪري سकين۔\nترجمہ: بھی کے لئے مصنوعی طور پر قدر"]}];let i=0,score={base:0,lora:0,tie:0};const app=document.getElementById('app');
