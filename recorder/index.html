<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sindhi Voice Recorder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;600&family=Figtree:wght@400;600&display=swap">
<style>
/* one column, one sentence at a time; Ajrak crimson for recording, indigo for everything else */
:root{--bg:#f6f3ef;--card:#fffdfa;--fg:#1d1a24;--muted:#6b6577;--line:#e3dcd3;--accent:#2d3a8c;--rec:#a3172b;--ok:#1f7a4d;--warn:#a35a00;
--sd:"Noto Naskh Arabic","Segoe UI","Geeza Pro",serif;--ui:Figtree,system-ui,-apple-system,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14121a;--card:#1d1a26;--fg:#f1edf5;--muted:#a59fb2;--line:#2f2a3b;--accent:#8f9cf0;--rec:#ff5a6e;--ok:#4cc58a;--warn:#f0a340;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--ui);
padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
h1{font-size:20px;margin:4px 0 0;text-wrap:balance}
p{margin:0}.muted{color:var(--muted);font-size:14px}
.sessions{display:grid;grid-template-columns:1fr;gap:8px}
.sess{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 16px;border:1px solid var(--line);
background:var(--card);color:var(--fg);border-radius:12px;font:600 16px var(--ui);text-align:left}
.sess small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.sess.done{opacity:.6}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.link{background:none;border:0;color:var(--accent);font:600 14px var(--ui);padding:8px 0}
.sentence{font:600 clamp(26px,7.5vw,34px)/1.9 var(--sd);direction:rtl;text-align:right;background:var(--card);border:1px solid var(--line);
border-radius:16px;padding:22px 18px;min-height:190px;display:flex;align-items:center}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .05s}
.status{min-height:22px;font-size:15px;text-align:center}.status.bad{color:var(--warn)}.status.rec{color:var(--rec);font-weight:600}
.big{width:100%;padding:20px;border-radius:16px;border:0;font:600 20px var(--ui);background:var(--accent);color:#fff}
.big.recording{background:var(--rec)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:15px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:600 16px var(--ui)}
.btn.primary{background:var(--ok);border-color:var(--ok);color:#fff}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45}
ul{margin:0;padding-left:20px;display:grid;gap:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script>
const URL_ = "https://ibrmcqqxowzhpjgfmmsx.supabase.co/storage/v1", KEY = "sb_publishable_AgEWnlG6Kk9buromI6sPEA_MOS65btA", BUCKET = "sindhi-voice";
const SECRET = location.hash.slice(1);
const SINCE = 1793311131412;   // shortcut: anon can't delete, so set-up test clips saved before this are ignored
const H = {apikey: KEY, Authorization: "Bearer " + KEY, "x-voice-key": SECRET};
const app = document.getElementById("app");
let script = [], done = {}, seconds = 0, session = 0, idx = 0, pending = 0;
let stream, ctx, proc, chunks = [], rate = 48000, recording = false, lastBlob = null, lastPeak = 0, lastDur = 0, wake;

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mins = s => (s / 60).toFixed(1);

async function listAll() {
  const latest = {};   // names sort by time within an id, so the last take seen is the one that counts
  for (let offset = 0; ; offset += 1000) {
    const r = await fetch(`${URL_}/object/list/${BUCKET}`, {method: "POST", headers: {...H, "Content-Type": "application/json"},
      body: JSON.stringify({prefix: SECRET + "/", limit: 1000, offset})});
    if (!r.ok) throw new Error("list " + r.status);
    const items = await r.json();
    for (const it of items) {
      const m = it.name.match(/^(\d{4})-(\d+)(?:-(\d+)ms)?\.(wav|json)$/);
      if (!m || +m[2] < SINCE) continue;
      latest[m[1]] = m[4] === "json" ? 0 : +(m[3] || 0) / 1000;
    }
    if (items.length < 1000) break;
  }
  done = {}; seconds = 0;
  for (const [id, s] of Object.entries(latest)) { done[id] = s ? "wav" : "skip"; seconds += s; }
}

function home() {
  const sessions = [...new Set(script.map(s => s[1]))];
  const total = script.filter(s => done[s[0]]).length;
  app.innerHTML = `<h1>Sindhi voice: ${mins(seconds)} of 60 minutes recorded</h1>
  <div class="bar"><i style="width:${Math.min(100, seconds / 36)}%"></i></div>
  <p class="muted">${total} of ${script.length} sentences done. One session is 100 sentences, about 20 minutes. Do one a day.</p>
  <div class="card"><b>Every time</b><ul>
    <li>Same quiet room, doors and windows shut, no fan or TV.</li>
    <li>Phone flat on the table, a hand's width from your mouth.</li>
    <li>Read in your normal voice, like telling a friend. Not too fast.</li>
    <li>Tap record, wait one second, read, wait one second, tap stop.</li>
    <li>A wrong word? Tap "Again". A sentence that makes no sense? Tap "Skip".</li>
  </ul></div>
  <div class="sessions">${sessions.map(n => {
    const items = script.filter(s => s[1] === n), d = items.filter(s => done[s[0]]).length;
    return `<button class="sess${d === items.length ? " done" : ""}" data-s="${n}">Session ${n}<small>${d} / ${items.length}</small></button>`;
  }).join("")}</div>`;
  app.querySelectorAll(".sess").forEach(b => b.onclick = () => start(+b.dataset.s));
}

function items() { return script.filter(s => s[1] === session); }

function start(n) {
  session = n;
  const list = items();
  idx = list.findIndex(s => !done[s[0]]);
  if (idx < 0) idx = 0;
  try { navigator.wakeLock?.request("screen").then(w => wake = w).catch(() => {}); } catch (e) {}
  show();
}

function show(msg = "", cls = "") {
  const list = items(), s = list[idx], d = list.filter(x => done[x[0]]).length;
  if (!s) return home();
  app.innerHTML = `<div class="top"><button class="link" id="back">‹ Sessions</button>
    <span>Session ${session} · ${d}/${list.length} · ${mins(seconds)} min${pending ? ` · ${pending} uploading` : ""}</span></div>
  <div class="sentence" lang="sd">${esc(s[2])}</div>
  <div class="meter"><i id="lvl"></i></div>
  <p class="status ${cls}" id="st">${msg || (done[s[0]] ? "Already recorded. Record again or go next." : "Tap record, then read the sentence.")}</p>
  <button class="big${recording ? " recording" : ""}" id="rec">${recording ? "■ Stop" : "● Record"}</button>
  <div class="row" id="after" ${lastBlob ? "" : "hidden"}>
    <button class="btn" id="play">▶ Listen</button><button class="btn" id="again">↺ Again</button></div>
  <button class="btn primary" id="next" ${lastBlob ? "" : "hidden"}>Save and next ›</button>
  <div class="row"><button class="btn" id="prev" ${idx ? "" : "disabled"}>‹ Previous</button><button class="btn" id="skip">Skip sentence</button></div>`;
  document.getElementById("back").onclick = () => { stopMic(); lastBlob = null; home(); };
  document.getElementById("rec").onclick = toggle;
  document.getElementById("again").onclick = () => { lastBlob = null; show(); };
  document.getElementById("play").onclick = () => new Audio(URL.createObjectURL(lastBlob)).play();
  document.getElementById("next").onclick = () => { upload(s[0], lastBlob, "wav", lastDur); lastBlob = null; idx++; show(); };
  document.getElementById("skip").onclick = () => { if (recording) return; upload(s[0], new Blob(['{"skip":true}'], {type: "application/json"}), "json", 0); lastBlob = null; idx++; show(); };
  document.getElementById("prev").onclick = () => { if (recording) return; lastBlob = null; idx--; show(); };
}

async function toggle() {
  if (recording) return stopRec();
  try {
    if (!stream) {
      stream = await navigator.mediaDevices.getUserMedia({audio: {channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false}});
    }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    rate = ctx.sampleRate;
    const src = ctx.createMediaStreamSource(stream);
    proc = ctx.createScriptProcessor(4096, 1, 1);
    chunks = []; lastPeak = 0;
    proc.onaudioprocess = e => {
      const x = e.inputBuffer.getChannelData(0);
      chunks.push(new Float32Array(x));
      let p = 0; for (let i = 0; i < x.length; i++) p = Math.max(p, Math.abs(x[i]));
      lastPeak = Math.max(lastPeak, p);
      const l = document.getElementById("lvl");
      if (l) { l.style.width = Math.min(100, p * 140) + "%"; l.style.background = p > 0.98 ? "var(--rec)" : "var(--ok)"; }
    };
    src.connect(proc); proc.connect(ctx.destination);
    recording = true; lastBlob = null;
    show("Recording… read now", "rec");
  } catch (e) {
    show("Microphone blocked. Allow the microphone for this site in your browser settings, then reload.", "bad");
  }
}

function stopRec() {
  recording = false;
  proc.disconnect(); ctx.close();
  const n = chunks.reduce((a, c) => a + c.length, 0), pcm = new Float32Array(n);
  let o = 0; for (const c of chunks) { pcm.set(c, o); o += c.length; }
  lastDur = Math.round(n / rate * 1000);
  lastBlob = wav(pcm, rate);
  const msg = lastDur < 1500 ? ["Too short. Tap Again and read the whole sentence.", "bad"]
    : lastPeak > 0.98 ? ["Too loud, it crackled. Move the phone a bit further away and tap Again.", "bad"]
    : lastPeak < 0.06 ? ["Very quiet. Bring the phone a bit closer and tap Again.", "bad"]
    : ["Sounds good. Listen if you like, then Save and next.", ""];
  show(...msg);
}

function stopMic() {
  if (recording) { recording = false; proc.disconnect(); ctx.close(); }
  stream?.getTracks().forEach(t => t.stop()); stream = null;
}

function wav(pcm, sr) {   // 16-bit mono PCM WAV: lossless, which is what TTS training wants
  const b = new DataView(new ArrayBuffer(44 + pcm.length * 2)), w = (o, s) => [...s].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); b.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true); b.setUint32(24, sr, true);
  b.setUint32(28, sr * 2, true); b.setUint16(32, 2, true); b.setUint16(34, 16, true); w(36, "data"); b.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) b.setInt16(44 + i * 2, Math.max(-1, Math.min(1, pcm[i])) * 0x7fff, true);
  return new Blob([b], {type: "audio/wav"});
}

async function upload(id, blob, ext, ms) {
  const name = `${SECRET}/${id}-${Date.now()}${ext === "wav" ? `-${ms}ms` : ""}.${ext}`;
  const firstTime = !done[id];
  done[id] = ext === "wav" ? "wav" : "skip";
  if (firstTime && ext === "wav") seconds += ms / 1000;
  pending++; refreshTop();
  for (let attempt = 0; attempt < 6; attempt++) {
    try {
      const r = await fetch(`${URL_}/object/${BUCKET}/${name}`, {method: "POST", headers: {...H, "Content-Type": blob.type}, body: blob});
      if (r.ok) { pending--; refreshTop(); return; }
    } catch (e) {}
    await new Promise(r => setTimeout(r, 2000 * (attempt + 1)));
  }
  pending--; delete done[id];
  if (firstTime && ext === "wav") seconds -= ms / 1000;
  show("Couldn't save the last one (no internet?). Go back with Previous and record it again.", "bad");
}

function refreshTop() { const t = app.querySelector(".top span"); if (t && !recording) { const list = items();
  t.textContent = `Session ${session} · ${list.filter(x => done[x[0]]).length}/${list.length} · ${mins(seconds)} min${pending ? ` · ${pending} uploading` : ""}`; } }

addEventListener("beforeunload", e => { if (pending) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && wake) navigator.wakeLock?.request("screen").then(w => wake = w).catch(() => {}); });

(async () => {
  if (!SECRET) { app.innerHTML = `<h1>Sindhi Voice Recorder</h1><p class="muted">Open the full link you were sent. It has a private key after the # sign.</p>`; return; }
  try {
    script = await (await fetch("script.json")).json();
    await listAll();
    home();
  } catch (e) {
    app.innerHTML = `<h1>Can't reach the recordings store</h1><p class="muted">Check your internet and reload. (${esc(String(e.message || e))})</p>`;
  }
})();
</script>
</body>
</html>
